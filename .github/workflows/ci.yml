name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: System Guarantee Invariants (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install library and test dependencies
        run: python -m pip install '.[dev]'
      - name: Run invariant tests
        run: PYTHONPATH=src python -m pytest tests/invariants/ -v -s
        # Failure here means a system guarantee has been violated.
        # Do NOT bypass. Follow the Change Policy in docs/guarantees.md.
        # The -s flag ensures the Guarantee Diff Summary is printed in CI logs.

  tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and test dependencies
        run: python -m pip install '.[dev]'
      - name: Run all tests
        run: PYTHONPATH=src python -m pytest tests/ -v

  package:
    name: Installed wheel regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/claimlayer-wheel-env"
          "$RUNNER_TEMP/claimlayer-wheel-env/bin/python" -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/claimlayer-wheel-env/bin/python" -I -m pytest "$GITHUB_WORKSPACE/tests/test_evidence_boundary_regressions.py" -v
