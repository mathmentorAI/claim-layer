name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  invariants-and-tests:
    name: System Guarantees (G1–G8) & Harness² Showcase
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and test dependencies
        run: python -m pip install '.[dev]'
      - name: Run formal invariant & sandbox tests
        run: python -m pytest -v
      - name: Run Harness² Case 1 replay & bottleneck benchmark
        run: |
          python examples/harness2_securitization/replay_om_vs_indenture.py
          python benchmarks/verification_bottleneck_bench.py

  package:
    name: Zero-Dependency Wheel Build & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/claimlayer-wheel-env"
          "$RUNNER_TEMP/claimlayer-wheel-env/bin/python" -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/claimlayer-wheel-env/bin/python" -I -m pytest "$GITHUB_WORKSPACE/tests/test_computable_verification.py" -v
